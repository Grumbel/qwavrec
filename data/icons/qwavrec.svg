<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ba3d6"/>
      <stop offset="50%" style="stop-color:#3a7ab8"/>
      <stop offset="100%" style="stop-color:#1e4d7b"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="redbtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="speaker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d76e"/>
      <stop offset="100%" style="stop-color:#d4a017"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="18" ry="18" fill="url(#bg)" stroke="#0a2a4a" stroke-width="3"/>
  <rect x="6" y="6" width="116" height="116" rx="18" ry="18" fill="url(#bevel)"/>
  <rect x="16" y="16" width="96" height="96" rx="12" ry="12" fill="#1a3a5c" stroke="#0d2137" stroke-width="2"/>
  <g transform="translate(28, 70)">
    <rect x="0" y="-8" width="6" height="16" rx="1" fill="#7dcea0"/>
    <rect x="10" y="-18" width="6" height="36" rx="1" fill="#52be80"/>
    <rect x="20" y="-28" width="6" height="56" rx="1" fill="#27ae60"/>
    <rect x="30" y="-14" width="6" height="28" rx="1" fill="#52be80"/>
    <rect x="40" y="-22" width="6" height="44" rx="1" fill="#27ae60"/>
    <rect x="50" y="-10" width="6" height="20" rx="1" fill="#7dcea0"/>
    <rect x="60" y="-30" width="6" height="60" rx="1" fill="#1e8449"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M 30 40 L 42 40 L 54 28 L 54 56 L 42 44 L 30 44 Z" fill="url(#speaker)" stroke="#8b6914" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="5" fill="#f7dc6f" stroke="#8b6914" stroke-width="1"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="96" cy="42" r="14" fill="url(#redbtn)" stroke="#7b241c" stroke-width="2"/>
    <circle cx="96" cy="42" r="7" fill="#e74c3c" stroke="#922b21" stroke-width="1"/>
  </g>
  <g transform="translate(70, 30)" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.8">
    <rect x="4" y="0" width="8" height="12" rx="4"/>
    <path d="M 2 10 Q 8 18 14 10" fill="none" stroke-width="1.5"/>
    <line x1="8" y1="18" x2="8" y2="22"/>
    <line x1="4" y1="22" x2="12" y2="22"/>
  </g>
